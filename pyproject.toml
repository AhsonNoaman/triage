[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "triage"
version = "0.1.0"
description = "An escalation-calibrated support agent over the CFPB Consumer Complaint Database"
requires-python = ">=3.11"
dependencies = [
    # Not an extra: `triage.agent` imports `anthropic.types` at module level, so the package
    # does not import without it. A clean clone of this repo failed `make check` on exactly
    # that until it was listed here.
    "anthropic>=0.69",
    "duckdb>=1.0",
    "httpx>=0.27",
    "pyarrow>=16.0",
]

[project.optional-dependencies]
analysis = [
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "scipy>=1.11",
]
dev = [
    "mypy>=1.11",
    "pandas-stubs",
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/triage"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/triage", "tests", "scripts"]
warn_unreachable = true
disallow_any_explicit = false

[[tool.mypy.overrides]]
module = ["duckdb.*", "matplotlib.*", "pyarrow.*", "scipy.*", "sklearn.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
